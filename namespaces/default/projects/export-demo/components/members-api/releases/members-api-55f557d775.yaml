                          }
                        }
                      }
                    }
                  }
                }
              },
              "components": {
                "schemas": {
                  "MemberInput": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "name",
                      "email"
                    ],
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1
                      },
                      "email": {
                        "type": "string",
                        "format": "email"
                      },
                      "role": {
                        "type": "string",
                        "default": "member",
                        "description": "Display field only; does not grant permissions."
                      }
                    }
                  },
                  "Member": {
                    "type": "object",
                    "required": [
                      "id",
                      "name",
                      "email",
                      "role"
                    ],
                    "properties": {
                      "id": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "name": {
                        "type": "string",
                        "minLength": 1
                      },
                      "email": {
                        "type": "string",
                        "format": "email"
                      },
                      "role": {
                        "type": "string",
                        "default": "member",
                        "description": "Display field only; does not grant permissions."
