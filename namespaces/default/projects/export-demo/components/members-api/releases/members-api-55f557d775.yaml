                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "properties": {
                                "status": {
                                  "type": "string",
                                  "enum": [
                                    "ok"
                                  ]
                                },
                                "service": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "/members": {
                  "get": {
                    "operationId": "listMembers",
                    "summary": "Show all members, sorted by ID",
                    "responses": {
                      "200": {
                        "description": "Member list",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "required": [
                                "data",
                                "count"
                              ],
                              "properties": {
                                "data": {
                                  "type": "array",
                                  "items": {
                                    "$ref": "#/components/schemas/Member"
                                  }
                                },
                                "count": {
                                  "type": "integer"
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  },
                  "post": {
                    "operationId": "addMember",
                    "summary": "Add a member",
                    "requestBody": {
                      "required": true,
                      "content": {
                        "application/json": {
                          "schema": {
                            "$ref": "#/components/schemas/MemberInput"
                          },
                          "example": {
                            "name": "Charlie Fernando",
                            "email": "charlie@example.com",
                            "role": "member"
                          }
                        }
                      }
                    },
                    "responses": {
                      "201": {
                        "description": "Created",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "required": [
                                "data"
                              ],
                              "properties": {
                                "data": {
                                  "$ref": "#/components/schemas/Member"
                                }
                              }
                            }
                          }
                        }
                      },
                      "400": {
                        "description": "Request failed",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "required": [
                                "error"
                              ],
                              "properties": {
                                "error": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        }
                      },
                      "413": {
                        "description": "Request failed",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "required": [
                                "error"
                              ],
                              "properties": {
                                "error": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        }
                      },
                      "415": {
                        "description": "Request failed",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "required": [
                                "error"
                              ],
                              "properties": {
                                "error": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "/members/{id}": {
                  "parameters": [
                    {
                      "name": "id",
                      "in": "path",
                      "required": true,
                      "schema": {
                        "type": "integer",
                        "minimum": 1
                      }
                    }
                  ],
                  "get": {
                    "operationId": "getMember",
                    "summary": "Show one member",
                    "responses": {
                      "200": {
                        "description": "Member found",
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
