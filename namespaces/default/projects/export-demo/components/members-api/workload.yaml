apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  labels:
    openchoreo.dev/component: members-api
    openchoreo.dev/project: export-demo
  name: members-api-workload
  namespace: default
spec:
  container:
    image: host.k3d.internal:10082/default-export-demo-members-api:v1-9df2cf44
  endpoints:
    http:
      basePath: /
      displayName: Members REST API
      port: 8080
      schema:
        content: |
          {
            "openapi": "3.0.3",
            "info": {
              "title": "Members Demo API",
              "version": "1.0.0",
              "description": "Small in-memory CRUD backend for an OpenChoreo demo. No authentication or database. All data resets on process restart. Use one replica. PUT replaces all member fields; omitted role defaults to member."
            },
            "servers": [
              {
                "url": "http://localhost:8080",
                "description": "Local. For a deployed service, replace with its full invoke base URL."
              }
            ],
            "paths": {
              "/healthz": {
                "get": {
                  "operationId": "health",
                  "summary": "Health check",
                  "responses": {
                    "200": {
                      "description": "Healthy",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "properties": {
                              "status": {
                                "type": "string",
                                "enum": [
                                  "ok"
                                ]
                              },
                              "service": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              },
              "/members": {
                "get": {
                  "operationId": "listMembers",
                  "summary": "Show all members, sorted by ID",
                  "responses": {
                    "200": {
                      "description": "Member list",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "data",
                              "count"
                            ],
                            "properties": {
                              "data": {
                                "type": "array",
                                "items": {
                                  "$ref": "#/components/schemas/Member"
                                }
                              },
                              "count": {
                                "type": "integer"
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "post": {
                  "operationId": "addMember",
                  "summary": "Add a member",
                  "requestBody": {
                    "required": true,
                    "content": {
                      "application/json": {
                        "schema": {
                          "$ref": "#/components/schemas/MemberInput"
                        },
                        "example": {
                          "name": "Charlie Fernando",
                          "email": "charlie@example.com",
                          "role": "member"
                        }
                      }
                    }
                  },
                  "responses": {
                    "201": {
                      "description": "Created",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "data"
                            ],
                            "properties": {
                              "data": {
                                "$ref": "#/components/schemas/Member"
                              }
                            }
                          }
                        }
                      }
                    },
                    "400": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    },
                    "413": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    },
                    "415": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              },
              "/members/{id}": {
                "parameters": [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": {
                      "type": "integer",
                      "minimum": 1
                    }
                  }
                ],
                "get": {
                  "operationId": "getMember",
                  "summary": "Show one member",
                  "responses": {
                    "200": {
                      "description": "Member found",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "data"
                            ],
                            "properties": {
                              "data": {
                                "$ref": "#/components/schemas/Member"
                              }
                            }
                          }
                        }
                      }
                    },
                    "400": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    },
                    "404": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "put": {
                  "operationId": "editMember",
                  "summary": "Replace member name, email and role",
                  "requestBody": {
                    "required": true,
                    "content": {
                      "application/json": {
                        "schema": {
                          "$ref": "#/components/schemas/MemberInput"
                        },
                        "example": {
                          "name": "Charlie Fernando",
                          "email": "charlie@example.com",
                          "role": "member"
                        }
                      }
                    }
                  },
                  "responses": {
                    "200": {
                      "description": "Updated",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "data"
                            ],
                            "properties": {
                              "data": {
                                "$ref": "#/components/schemas/Member"
                              }
                            }
                          }
                        }
                      }
                    },
                    "404": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    },
                    "400": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    },
                    "413": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    },
                    "415": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "delete": {
                  "operationId": "deleteMember",
                  "summary": "Delete a member",
                  "responses": {
                    "204": {
                      "description": "Deleted; no response body"
                    },
                    "400": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    },
                    "404": {
                      "description": "Request failed",
                      "content": {
                        "application/json": {
                          "schema": {
                            "type": "object",
                            "required": [
                              "error"
                            ],
                            "properties": {
                              "error": {
                                "type": "string"
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            },
            "components": {
              "schemas": {
                "MemberInput": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "name",
                    "email"
                  ],
                  "properties": {
                    "name": {
                      "type": "string",
                      "minLength": 1
                    },
                    "email": {
                      "type": "string",
                      "format": "email"
                    },
                    "role": {
                      "type": "string",
                      "default": "member",
                      "description": "Display field only; does not grant permissions."
                    }
                  }
                },
                "Member": {
                  "type": "object",
                  "required": [
                    "id",
                    "name",
                    "email",
                    "role"
                  ],
                  "properties": {
                    "id": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "name": {
                      "type": "string",
                      "minLength": 1
                    },
                    "email": {
                      "type": "string",
                      "format": "email"
                    },
                    "role": {
                      "type": "string",
                      "default": "member",
                      "description": "Display field only; does not grant permissions."
                    }
                  }
                }
              }
            }
          }
        type: openapi
      type: HTTP
      visibility:
      - external
  owner:
    componentName: members-api
    projectName: export-demo
  source:
    authoredAt: "2026-11-08T16:06:35Z"
    branch: main
    commit: 9df2cf44fc04b7cb837a2971c56320d417b1d09c
    repository: https://github.com/sakith03/members-demo-api.git
