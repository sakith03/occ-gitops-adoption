apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-platform
  namespace: flux-system
spec:
  interval: 5m
  path: ./namespaces/default/platform
  prune: false
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: openchoreo-gitops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-projects
  namespace: flux-system
spec:
  interval: 5m
  path: ./namespaces/default/projects
  prune: false
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: openchoreo-gitops
  # dependsOn:
  #   - name: openchoreo-platform