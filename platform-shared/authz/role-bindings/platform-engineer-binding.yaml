apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/instance: openchoreo-control-plane
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openchoreo-control-plane
    app.kubernetes.io/part-of: openchoreo
    app.kubernetes.io/version: v1.4.0-m.2
    helm.sh/chart: openchoreo-control-plane-1.4.0-m.2
    openchoreo.io/bootstrap: "true"
  name: platform-engineer-binding
spec:
  effect: allow
  entitlement:
    claim: groups
    value: platform-engineers
  roleMappings:
  - roleRef:
      kind: ClusterAuthzRole
      name: platform-engineer
    scope: {}
