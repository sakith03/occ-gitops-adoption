  name: health-probes
spec:
  environmentConfigs:
    openAPIV3Schema:
      properties:
        enabled:
          default: true
          description: Master switch for this environment. When disabled, none of
            the probes are configured here.
          type: boolean
          x-openchoreo-backstage-portal:
            ui:widget: checkbox
      type: object
  parameters:
    openAPIV3Schema:
      $defs:
        Handler:
          description: Select the type of probe to use and configure its parameters
          oneOf:
          - maxProperties: 0
            title: None
            type: object
          - properties:
              httpGet:
                properties:
                  path:
                    default: /
                    title: Path
                    type: string
                  port:
                    maximum: 65535
                    minimum: 1
                    title: Port
                    type: integer
                title: ""
                type: object
            required:
            - httpGet
            title: HTTP GET
          - properties:
              tcpSocket:
                properties:
                  port:
                    maximum: 65535
                    minimum: 1
                    title: Port
                    type: integer
                title: ""
                type: object
            required:
            - tcpSocket
            title: TCP socket
          - properties:
              grpc:
                properties:
                  port:
                    maximum: 65535
                    minimum: 1
                    title: Port
                    type: integer
                  service:
                    description: Optional name of the service to check. When unset,
                      the overall gRPC health is used.
                    title: Service
                    type: string
                title: ""
                type: object
            required:
            - grpc
            title: gRPC
          - properties:
              exec:
                properties:
                  command:
                    description: Command to run inside the container. A zero exit
                      code means healthy.
                    items:
                      type: string
                    title: Command
                    type: array
                title: ""
                type: object
            required:
            - exec
            title: Exec
          title: Handler
          x-openchoreo-backstage-portal:
            ui:options:
              hideError: true
      properties:
        containerName:
          default: main
          description: Name of the container the probes are attached to. Defaults
            to 'main'.
          title: Container name
          type: string
        liveness:
          default: {}
          description: Restarts the container when it stops being healthy.
          properties:
            enabled:
              default: false
              title: Enabled
              type: boolean
              x-openchoreo-backstage-portal:
                ui:widget: checkbox
            failureThreshold:
              default: 3
              minimum: 1
              title: Failure threshold
              type: integer
            handler:
              $ref: '#/$defs/Handler'
            initialDelaySeconds:
              default: 0
              description: Seconds to wait after the container starts before the first
                probe.
              minimum: 0
              title: Initial delay seconds
              type: integer
            periodSeconds:
              default: 10
              minimum: 1
              title: Period seconds
              type: integer
            timeoutSeconds:
              default: 1
              minimum: 1
              title: Timeout seconds
              type: integer
          title: Liveness probe
          type: object
          x-openchoreo-backstage-portal:
            ui:order:
            - enabled
            - handler
            - initialDelaySeconds
            - periodSeconds
            - timeoutSeconds
            - failureThreshold
        readiness:
          default: {}
          description: Removes the pod from service endpoints while it is not ready
            to receive traffic.
          properties:
            enabled:
              default: false
              title: Enabled
              type: boolean
              x-openchoreo-backstage-portal:
                ui:widget: checkbox
            failureThreshold:
              default: 3
              minimum: 1
              title: Failure threshold
              type: integer
            handler:
              $ref: '#/$defs/Handler'
            initialDelaySeconds:
              default: 0
              description: Seconds to wait after the container starts before the first
                probe.
              minimum: 0
              title: Initial delay seconds
              type: integer
            periodSeconds:
              default: 10
              minimum: 1
              title: Period seconds
              type: integer
            successThreshold:
              default: 1
              description: Consecutive successes before the pod is considered ready.
              minimum: 1
              title: Success threshold
              type: integer
            timeoutSeconds:
              default: 1
              minimum: 1
              title: Timeout seconds
              type: integer
          title: Readiness probe
          type: object
          x-openchoreo-backstage-portal:
            ui:order:
            - enabled
            - handler
            - initialDelaySeconds
            - periodSeconds
            - timeoutSeconds
            - failureThreshold
            - successThreshold
        startup:
          default: {}
          description: Holds off the liveness and readiness probes until the container
            has finished starting.
          properties:
            enabled:
              default: false
              title: Enabled
              type: boolean
              x-openchoreo-backstage-portal:
                ui:widget: checkbox
            failureThreshold:
              default: 30
              minimum: 1
              title: Failure threshold
              type: integer
            handler:
              $ref: '#/$defs/Handler'
            initialDelaySeconds:
              default: 0
              description: Seconds to wait after the container starts before the first
                probe.
              minimum: 0
              title: Initial delay seconds
              type: integer
            periodSeconds:
              default: 10
              minimum: 1
              title: Period seconds
              type: integer
            timeoutSeconds:
              default: 1
              minimum: 1
              title: Timeout seconds
              type: integer
          title: Startup probe
          type: object
          x-openchoreo-backstage-portal:
            ui:order:
            - enabled
            - handler
            - initialDelaySeconds
            - periodSeconds
            - timeoutSeconds
            - failureThreshold
      type: object
      x-openchoreo-backstage-portal:
        ui:order:
        - containerName
        - liveness
        - readiness
        - startup
  patches:
  - operations:
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe
      value: ${parameters.liveness.handler}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe/initialDelaySeconds
      value: ${parameters.liveness.initialDelaySeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe/periodSeconds
      value: ${parameters.liveness.periodSeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe/timeoutSeconds
      value: ${parameters.liveness.timeoutSeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe/failureThreshold
      value: ${parameters.liveness.failureThreshold}
    target:
      group: apps
      kind: Deployment
      version: v1
      where: ${environmentConfigs.enabled && parameters.liveness.enabled}
    targetPlane: dataplane
  - operations:
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe
      value: ${parameters.readiness.handler}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/initialDelaySeconds
      value: ${parameters.readiness.initialDelaySeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/periodSeconds
      value: ${parameters.readiness.periodSeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/timeoutSeconds
      value: ${parameters.readiness.timeoutSeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/failureThreshold
      value: ${parameters.readiness.failureThreshold}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/successThreshold
      value: ${parameters.readiness.successThreshold}
    target:
      group: apps
      kind: Deployment
      version: v1
      where: ${environmentConfigs.enabled && parameters.readiness.enabled}
    targetPlane: dataplane
  - operations:
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe
      value: ${parameters.startup.handler}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe/initialDelaySeconds
      value: ${parameters.startup.initialDelaySeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe/periodSeconds
      value: ${parameters.startup.periodSeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe/timeoutSeconds
      value: ${parameters.startup.timeoutSeconds}
    - op: add
      path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe/failureThreshold
      value: ${parameters.startup.failureThreshold}
    target:
      group: apps
      kind: Deployment
      version: v1
      where: ${environmentConfigs.enabled && parameters.startup.enabled}
    targetPlane: dataplane
  validations:
  - message: When the liveness probe is enabled, its handler must specify exactly
      one action (httpGet, tcpSocket, gRPC, or Exec) with a port between 1 and 65535,
      or a non-empty command for Exec.
    rule: ${!parameters.liveness.enabled || (has(parameters.liveness.handler) && size([has(parameters.liveness.handler.httpGet),
      has(parameters.liveness.handler.tcpSocket), has(parameters.liveness.handler.grpc),
      has(parameters.liveness.handler.exec)].filter(x, x)) == 1 && (!has(parameters.liveness.handler.httpGet)
      || (has(parameters.liveness.handler.httpGet.port) && parameters.liveness.handler.httpGet.port
      >= 1 && parameters.liveness.handler.httpGet.port <= 65535)) && (!has(parameters.liveness.handler.tcpSocket)
      || (has(parameters.liveness.handler.tcpSocket.port) && parameters.liveness.handler.tcpSocket.port
      >= 1 && parameters.liveness.handler.tcpSocket.port <= 65535)) && (!has(parameters.liveness.handler.grpc)
      || (has(parameters.liveness.handler.grpc.port) && parameters.liveness.handler.grpc.port
      >= 1 && parameters.liveness.handler.grpc.port <= 65535)) && (!has(parameters.liveness.handler.exec)
      || size(parameters.liveness.handler.exec.command) > 0))}
  - message: When the readiness probe is enabled, its handler must specify exactly
      one action (httpGet, tcpSocket, gRPC, or Exec) with a port between 1 and 65535,
      or a non-empty command for Exec.
    rule: ${!parameters.readiness.enabled || (has(parameters.readiness.handler) &&
      size([has(parameters.readiness.handler.httpGet), has(parameters.readiness.handler.tcpSocket),
      has(parameters.readiness.handler.grpc), has(parameters.readiness.handler.exec)].filter(x,
      x)) == 1 && (!has(parameters.readiness.handler.httpGet) || (has(parameters.readiness.handler.httpGet.port)
      && parameters.readiness.handler.httpGet.port >= 1 && parameters.readiness.handler.httpGet.port
      <= 65535)) && (!has(parameters.readiness.handler.tcpSocket) || (has(parameters.readiness.handler.tcpSocket.port)
      && parameters.readiness.handler.tcpSocket.port >= 1 && parameters.readiness.handler.tcpSocket.port
      <= 65535)) && (!has(parameters.readiness.handler.grpc) || (has(parameters.readiness.handler.grpc.port)
      && parameters.readiness.handler.grpc.port >= 1 && parameters.readiness.handler.grpc.port
      <= 65535)) && (!has(parameters.readiness.handler.exec) || size(parameters.readiness.handler.exec.command)
      > 0))}
  - message: When the startup probe is enabled, its handler must specify exactly one
      action (httpGet, tcpSocket, gRPC, or Exec) with a port between 1 and 65535,
      or a non-empty command for Exec.
    rule: ${!parameters.startup.enabled || (has(parameters.startup.handler) && size([has(parameters.startup.handler.httpGet),
      has(parameters.startup.handler.tcpSocket), has(parameters.startup.handler.grpc),
      has(parameters.startup.handler.exec)].filter(x, x)) == 1 && (!has(parameters.startup.handler.httpGet)
      || (has(parameters.startup.handler.httpGet.port) && parameters.startup.handler.httpGet.port
      >= 1 && parameters.startup.handler.httpGet.port <= 65535)) && (!has(parameters.startup.handler.tcpSocket)
      || (has(parameters.startup.handler.tcpSocket.port) && parameters.startup.handler.tcpSocket.port
      >= 1 && parameters.startup.handler.tcpSocket.port <= 65535)) && (!has(parameters.startup.handler.grpc)
      || (has(parameters.startup.handler.grpc.port) && parameters.startup.handler.grpc.port
      >= 1 && parameters.startup.handler.grpc.port <= 65535)) && (!has(parameters.startup.handler.exec)
      || size(parameters.startup.handler.exec.command) > 0))}
